<html>
<head>

<style>

  #overlay {
  position: absolute;
  display: none;
  left: 10%;
  top: 10%;
  width: 80%;
  height: 80%;
  background-color: rgba(0, 0, 0, 0.2);
  z-index: 2;
  cursor: pointer;
}     
.center {
  display: flex;
  justify-content: center;
  align-items: center;
}       
</style>

</head>


<body>
<div id="overlay" onclick="off()"></div>

<div class="center">
  <p>Have you ever wondered if you were gay before? With just a few easy questions, this quiz can solve all of your wants and desires.</p>
</div>

<p>Do you already know if you're gay? Well then this quiz will be mighty reassuring to you.</p>

<p>Are you ready to begin</p>

<div class="center">
<button onclick="quizstart()">Explore my Gayness!</button></div>

</body>
<script>
function quizstart() {
 document.getElementById("overlay").style.display = "flex";
}
function off() {
  document.getElementById("overlay").style.display = "none";
}
</script>
</html>
