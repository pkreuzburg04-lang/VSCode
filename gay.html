<html>
<head>

<style>
.container {
  display: flex; /* Enables CSS flexbox */
  justify-content: center; /* Centers horizontally */
}
button {
  padding: 10px 20px;
}

#begin{
text-align: center;
}

/* Popup container - can be anything you want */
.popup {
  position: relative;
  display: inline-block;
  cursor: pointer;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

/* The actual popup */
.popup .popuptext {
  visibility: hidden;
  width: 160px;
  background-color: #555;
  color: #fff;
  text-align: center;
  border-radius: 6px;
  padding: 8px 0;
justify-content: center;
  z-index: 1;
  bottom: 125%;
  left: 50%;
}



/* Toggle this class - hide and show the popup */
.popup .show {
  visibility: visible;
  -webkit-animation: fadeIn 1s;
  animation: fadeIn 1s;
}
                    
</style>

</head>


<body>

<p>Have you ever wondered if you were gay before? With just a few easy questions, this quiz can solve all of your wants and desires.</p>

<p>Do you already know if you're gay? Well then this quiz will be mighty reassuring to you.</p>

<p>Are you ready to begin</p>

<div class="popup" onclick="myFunction()">Click me to toggle the popup!
  <span class="popuptext" id="myPopup">A Simple Popup!</span>
</div>

</body>
<script>
function myFunction() {
  var popup = document.getElementById("myPopup");
  popup.classList.toggle("show");
}
</script>
</html>
